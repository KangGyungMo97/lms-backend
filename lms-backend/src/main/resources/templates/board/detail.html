<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>게시글 상세</title>
  <style>
    .post { background: #fff; border-top: 2px solid #1f3a5f; border-bottom: 1px solid #e5e5e5; }
    .post-title { margin: 0; padding: 16px; font-size: 20px; border-bottom: 1px solid #e5e5e5; }
    .post-meta { padding: 10px 16px; color: #666; font-size: 13px; border-bottom: 1px solid #e5e5e5; }
    .post-meta span + span::before { content: "|"; margin: 0 8px; color: #ccc; }
    .post-content { padding: 24px 16px; min-height: 200px; line-height: 1.7; white-space: pre-wrap; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; }
    .btn-danger { border-color: #c0392b; color: #c0392b; }
    /* 댓글 */
    .comments { margin-top: 28px; }
    .comments h4 { margin: 0 0 8px; font-size: 16px; }
    .comments h4 b { color: #1f3a5f; }
    .comment-list { list-style: none; margin: 0; padding: 0; background: #fff; border-top: 1px solid #1f3a5f; }
    .comment-list li { padding: 12px 16px; border-bottom: 1px solid #e5e5e5; }
    .comment-head { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 6px; }
    .comment-head b { color: #222; margin-right: 8px; }
    .comment-head a { margin-left: 8px; color: #1f3a5f; font-size: 12px; text-decoration: none; }
    .comment-head a.del { color: #c0392b; }
    .comment-body { white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
    .comment-empty { padding: 20px 16px; color: #888; font-size: 14px; }
    .comment-form { margin-top: 12px; background: #fff; padding: 12px 16px; border: 1px solid #e5e5e5; }
    .comment-form textarea { width: 100%; height: 80px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
           font-family: inherit; font-size: 14px; resize: vertical; box-sizing: border-box; }
    .comment-form .bottom { display: flex; justify-content: flex-end; margin-top: 8px; }
    .btn-primary { background: #1f3a5f; color: #fff; cursor: pointer; }
    .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 8px 12px; margin-bottom: 8px; font-size: 14px; }
    .errors p { margin: 2px 0; }
    /* 댓글 바로 수정 (수정 버튼 누르면 내용 자리에 입력창이 나옴) */
    .comment-edit { display: none; }
    .comment-edit textarea { width: 100%; height: 70px; padding: 8px 10px; border: 1px solid #1f3a5f; border-radius: 4px;
           font-family: inherit; font-size: 14px; resize: vertical; box-sizing: border-box; }
    .comment-edit .bottom { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
    .btn-sm { padding: 4px 10px; font-size: 13px; }
    li.editing .comment-body { display: none; }
    li.editing .comment-edit { display: block; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>자유게시판</h2>

    <div class="post">
      <h3 class="post-title" th:text="${board.boardTitle}">제목</h3>
      <div class="post-meta">
        <span>작성자 <b th:text="${board.writer.userName}">작성자</b></span>
        <span>작성일 <span th:text="${#temporals.format(board.boardCreateDate, 'yyyy-MM-dd')}">2026-10-11</span></span>
        <span th:if="${board.boardUpdateDate != board.boardCreateDate}">수정일 <span th:text="${#temporals.format(board.boardUpdateDate, 'yyyy-MM-dd')}">2026-10-11</span></span>
        <span>조회 <span th:text="${board.boardViewCount}">0</span></span>
      </div>
      <!-- white-space: pre-wrap 으로 줄바꿈 그대로 표시, th:text 라 HTML 태그는 글자로 나옴(안전) -->
      <div class="post-content" th:text="${board.boardContent}">내용</div>
    </div>

    <!-- 추천(후순위) · 첨부파일(P3)은 기능이 생기면 여기에 추가 -->

    <div class="actions">
      <a th:href="@{/board/list}" class="btn">목록</a>
      <div>
        <a th:if="${isWriter}" th:href="@{|/board/modify/${board.boardId}|}" class="btn">수정</a>
        <a th:if="${canDelete}" th:href="@{|/board/delete/${board.boardId}|}" class="btn btn-danger"
           onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
      </div>
    </div>

    <!-- ===== 댓글 ===== -->
    <div class="comments" id="comments">
      <h4>댓글 <b th:text="${#lists.size(commentList)}">0</b></h4>

      <ul class="comment-list">
        <li th:if="${#lists.isEmpty(commentList)}" class="comment-empty">첫 댓글을 남겨 보세요.</li>
        <li th:each="c : ${commentList}" th:id="|comment_${c.commentId}|">
          <div class="comment-head">
            <div>
              <b th:text="${c.writer.userName}">작성자</b>
              <span th:text="${#temporals.format(c.commentCreateDate, 'yyyy-MM-dd HH:mm')}">2026-10-13 11:00</span>
              <span th:if="${c.commentUpdateDate != null}">(수정됨)</span>
            </div>
            <div>
              <!-- 수정: 내 댓글만 / 삭제: 내 댓글 또는 관리자 -->
              <!-- 누르면 이 자리에서 바로 수정 (자바스크립트가 꺼져 있으면 href 의 수정 화면으로 이동) -->
              <a th:if="${c.writer.userId == loginId}" th:href="@{|/board/comment/modify/${c.commentId}|}"
                 th:attr="data-id=${c.commentId}" onclick="return openEdit(this.dataset.id);">수정</a>
              <a th:if="${c.writer.userId == loginId or isAdmin}" th:href="@{|/board/comment/delete/${c.commentId}|}"
                 class="del" onclick="return confirm('댓글을 삭제하시겠습니까?');">삭제</a>
            </div>
          </div>
          <!-- th:text 라 HTML 태그는 글자로 나옴(안전) -->
          <div class="comment-body" th:text="${c.commentContent}">댓글 내용</div>

          <!-- 수정 입력창 (평소엔 숨김, 내 댓글에만 있음) -->
          <form th:if="${c.writer.userId == loginId}" class="comment-edit"
                th:action="@{|/board/comment/modify/${c.commentId}|}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <textarea name="content" maxlength="300" required th:text="${c.commentContent}">댓글 내용</textarea>
            <div class="bottom">
              <button type="button" class="btn btn-sm" th:attr="data-id=${c.commentId}"
                      onclick="closeEdit(this.dataset.id);">취소</button>
              <button type="submit" class="btn btn-primary btn-sm">저장</button>
            </div>
          </form>
        </li>
      </ul>

      <!-- 댓글 작성 -->
      <form class="comment-form" th:action="@{|/board/comment/create/${board.boardId}|}" th:object="${commentForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="errors" th:if="${#fields.hasAnyErrors()}">
          <p th:each="err : ${#fields.allErrors()}" th:text="${err}">오류 메시지</p>
        </div>
        <textarea th:field="*{content}" maxlength="300" placeholder="댓글을 입력하세요. (300자 이내)"></textarea>
        <div class="bottom">
          <button type="submit" class="btn btn-primary">댓글 등록</button>
        </div>
      </form>
    </div>

    <script>
      // 댓글 수정: 내용 자리를 입력창으로 바꿈 (한 번에 하나만 열리게)
      function openEdit(id) {
        document.querySelectorAll('li.editing').forEach(li => li.classList.remove('editing'));
        const li = document.getElementById('comment_' + id);
        li.classList.add('editing');
        const ta = li.querySelector('.comment-edit textarea');
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);   // 커서를 글 끝으로
        return false;   // 수정 화면으로 이동하지 않게
      }
      // 취소: 입력창 닫고 원래 내용으로 되돌리기
      function closeEdit(id) {
        const li = document.getElementById('comment_' + id);
        li.classList.remove('editing');
        li.querySelector('.comment-edit textarea').value = li.querySelector('.comment-body').textContent;
      }
    </script>

  </div>
</body>

</html>
