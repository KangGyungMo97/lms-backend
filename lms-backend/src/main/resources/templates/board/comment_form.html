<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>댓글 수정</title>
  <style>
    .form-box { background: #fff; border-top: 2px solid #1f3a5f; padding: 20px 16px; }
    .form-box textarea { width: 100%; height: 150px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
           font-family: inherit; font-size: 14px; resize: vertical; box-sizing: border-box; }
    .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
    .errors p { margin: 2px 0; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #1f3a5f; color: #fff; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>댓글 수정</h2>

    <!-- action 을 비워 두면 지금 주소(/board/comment/modify/{commentId})로 POST 됨 -->
    <form th:object="${commentForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="errors" th:if="${#fields.hasAnyErrors()}">
        <p th:each="err : ${#fields.allErrors()}" th:text="${err}">오류 메시지</p>
      </div>

      <div class="form-box">
        <textarea th:field="*{content}" maxlength="300" placeholder="댓글을 입력하세요. (300자 이내)"></textarea>
      </div>

      <div class="actions">
        <!-- 취소: 브라우저 뒤로 가기 (게시글 상세로 돌아감) -->
        <a href="javascript:history.back()" class="btn">취소</a>
        <button type="submit" class="btn btn-primary">수정</button>
      </div>
    </form>

  </div>
</body>

</html>
