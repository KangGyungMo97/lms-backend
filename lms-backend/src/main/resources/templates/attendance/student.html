<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>출석</title>
  <style>
    h3 { margin: 28px 0 10px; }
    .msg { padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; font-size: 14px; }
    .msg.ok { background: #e8f5e9; color: #2e7d32; }
    .msg.fail { background: #fdecea; color: #c0392b; }
    .att-card { background: #fff; border: 1px solid #e5e5e5; border-top: 2px solid #1f3a5f; padding: 16px; margin-bottom: 12px; }
    .att-title { font-size: 17px; font-weight: bold; margin-bottom: 6px; }
    .att-title a { color: #222; text-decoration: none; }
    .att-meta { color: #666; font-size: 13px; margin-bottom: 12px; }
    .att-meta span + span::before { content: "|"; margin: 0 8px; color: #ccc; }
    .att-form { display: flex; gap: 8px; align-items: center; }
    .att-form input[type=text] { width: 160px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
           font-size: 18px; letter-spacing: 4px; text-align: center; }
    .btn { display: inline-block; padding: 8px 16px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #1f3a5f; color: #fff; font-size: 14px; cursor: pointer; }
    .left { color: #c0392b; font-size: 13px; }
    .done { color: #2e7d32; font-weight: bold; }
    .locked { color: #c0392b; font-weight: bold; }
    .empty { padding: 30px 0; color: #888; text-align: center; background: #fff; border: 1px solid #e5e5e5; }
    table.board { width: 100%; border-collapse: collapse; background: #fff; }
    table.board th, table.board td { padding: 10px 8px; border-bottom: 1px solid #e5e5e5; font-size: 14px; text-align: center; }
    table.board th { background: #eef2f7; border-top: 2px solid #1f3a5f; }
    table.board td.title { text-align: left; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>출석</h2>

    <!-- 코드 입력 결과 (맞음 / 틀림 / 마감 ...) -->
    <div class="msg" th:if="${resultMsg != null}"
         th:classappend="${resultOk} ? 'ok' : 'fail'" th:text="${resultMsg}">결과 메시지</div>

    <h3>출석 가능한 수업</h3>

    <p class="empty" th:if="${#lists.isEmpty(openSessions)}">지금 출석할 수 있는 수업이 없습니다.</p>

    <!-- th:each 가 th:with 보다 먼저 실행돼서 with 안에서 s 를 쓸 수 있음 -->
    <div class="att-card" th:each="s : ${openSessions}" th:with="fc=${failCount[s.sessionId] ?: 0}, my=${myStatus[s.lesson.lessonId]}">
      <div class="att-title">
        <a th:href="@{|/lesson/detail/${s.lesson.lessonId}|}" th:text="${s.lesson.lessonTitle}">수업명</a>
      </div>
      <div class="att-meta">
        <span th:text="${s.lesson.course.courseTitle}">과정명</span>
        <span th:text="|${s.lesson.course.teacher.userName} 교수|">교수</span>
        <span>마감 <b th:text="${#temporals.format(s.expiresAt, 'HH:mm:ss')}">10:10:00</b></span>
      </div>

      <!-- 이미 기록이 있음 (Y 출석 / L 지각 / E 공결 / N 결석 - 교수가 처리한 경우 포함) -->
      <div class="done" th:if="${my != null}" th:classappend="${my == 'N'} ? 'locked'"
           th:text="${my == 'Y' ? '출석 완료' : my == 'L' ? '지각 처리되었습니다' : my == 'E' ? '공결 처리되었습니다' : '결석 처리되었습니다'}">출석 완료</div>

      <!-- 5회 틀려서 잠김 -->
      <div class="locked"
           th:if="${my == null and fc ge maxFail}"
           th:text="|${maxFail}회 모두 틀려서 이번 수업은 더 이상 입력할 수 없습니다.|">잠김</div>

      <!-- 코드 입력 -->
      <form class="att-form" method="post"
            th:if="${my == null and fc lt maxFail}"
            th:action="@{|/attendance/check/${s.lesson.lessonId}|}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="text" name="code" maxlength="6" inputmode="numeric" autocomplete="off"
               pattern="\d{6}" placeholder="6자리 숫자" required>
        <button type="submit" class="btn">출석</button>
        <span class="left" th:if="${fc > 0}" th:text="|남은 기회 ${maxFail - fc}회|">남은 기회 4회</span>
      </form>
    </div>

    <h3>내 출석 기록</h3>

    <table class="board">
      <thead>
        <tr>
          <th>수업명</th>
          <th style="width:200px">과정</th>
          <th style="width:90px">상태</th>
          <th style="width:180px">출석 시각</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(myAtts)}">
          <td colspan="4" class="empty">출석 기록이 없습니다.</td>
        </tr>
        <tr th:each="a : ${myAtts}">
          <td class="title" th:text="${a.lesson.lessonTitle}">수업명</td>
          <td th:text="${a.lesson.course.courseTitle}">과정명</td>
          <!-- Y 출석 / L 지각 / E 공결 / N 미출석 -->
          <td th:text="${a.attStatus == 'Y' ? '출석' : a.attStatus == 'L' ? '지각' : a.attStatus == 'E' ? '공결' : '미출석'}">출석</td>
          <td th:text="${#temporals.format(a.attDate, 'yyyy-MM-dd HH:mm')}">2026-10-15 09:05</td>
        </tr>
      </tbody>
    </table>

  </div>
</body>

</html>
