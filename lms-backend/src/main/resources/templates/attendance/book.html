<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>출석부</title>
  <style>
    .msg { padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; font-size: 14px; background: #e8f5e9; color: #2e7d32; }
    .meta { color: #666; font-size: 13px; margin: 6px 0 4px; }
    .hint { color: #888; font-size: 12px; margin: 0 0 12px; }
    .legend { font-size: 13px; margin: 0 0 10px; }
    .legend span { display: inline-block; padding: 2px 8px; border-radius: 3px; margin-right: 6px; }
    .scroll { overflow-x: auto; background: #fff; border: 1px solid #e5e5e5; }
    table.book { border-collapse: collapse; min-width: 100%; }
    table.book th, table.book td { padding: 8px 6px; border-bottom: 1px solid #e5e5e5; font-size: 13px; text-align: center; white-space: nowrap; }
    table.book th { background: #eef2f7; border-top: 2px solid #1f3a5f; }
    table.book th.lesson { white-space: normal; min-width: 76px; max-width: 110px; font-weight: normal; }
    table.book td.name { text-align: left; }
    table.book tr:target td { background: #fffbe6; }   /* 수정하고 돌아온 학생 줄 강조 */
    .cnt { font-weight: bold; }
    .cnt-n { color: #c0392b; }
    select.st { padding: 3px 2px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; cursor: pointer; }
    select.st-Y { background: #e8f5e9; color: #2e7d32; }
    select.st-L { background: #fff3e0; color: #e65100; }
    select.st-E { background: #e3f2fd; color: #1565c0; }
    select.st-N { background: #fdecea; color: #c0392b; }
    select.st-none { background: #f5f5f5; color: #999; }
    .empty { padding: 40px 0; color: #888; text-align: center; }
    .actions { margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2 th:text="|${course.courseTitle} 출석부|">과정명 출석부</h2>

    <div class="msg" th:if="${bookMsg != null}" th:text="${bookMsg}">변경했습니다.</div>

    <p class="meta"
       th:text="|${course.subject.subjectName} · 학생 ${#lists.size(rows)}명 · 수업 ${#lists.size(lessons)}회차|">과목 · 학생 · 수업</p>
    <p class="hint">학생 명단은 같은 학과 학생을 기준으로 합니다. 칸의 상태를 바꾸면 바로 저장됩니다.</p>

    <p class="legend">
      <span style="background:#e8f5e9;color:#2e7d32">출석</span>
      <span style="background:#fff3e0;color:#e65100">지각</span>
      <span style="background:#e3f2fd;color:#1565c0">공결</span>
      <span style="background:#fdecea;color:#c0392b">결석 (진행했는데 기록 없음 포함)</span>
      <span style="background:#f5f5f5;color:#999">- 아직 진행 안 한 수업</span>
    </p>

    <p class="empty" th:if="${#lists.isEmpty(lessons)}">이 과정에 등록된 수업이 없습니다.</p>
    <p class="empty" th:if="${!#lists.isEmpty(lessons) and #lists.isEmpty(rows)}">표시할 학생이 없습니다.</p>

    <div class="scroll" th:if="${!#lists.isEmpty(lessons) and !#lists.isEmpty(rows)}">
      <table class="book">
        <thead>
          <tr>
            <th style="width:90px">학번</th>
            <th style="width:90px">이름</th>
            <th class="lesson" th:each="l : ${lessons}" th:text="${l.lessonTitle}">1주차</th>
            <th>출석</th>
            <th>지각</th>
            <th>공결</th>
            <th>결석</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${rows}" th:id="|u-${r.student.userId}|">
            <td th:text="${r.student.userId}">2610001</td>
            <td class="name" th:text="${r.student.userName}">학생</td>

            <td th:each="l : ${lessons}" th:with="st=${r.cells[l.lessonId]}">
              <!-- 값을 바꾸면 changeAtt() 가 확인 후 아래 숨은 폼으로 저장 -->
              <select class="st" th:classappend="${st == '-'} ? 'st-none' : |st-${st}|"
                      onchange="changeAtt(this)"
                      th:attr="data-orig=${st == '-' ? '' : st}, data-user=${r.student.userId}, data-name=${r.student.userName}, data-lesson-title=${l.lessonTitle}, data-action=@{|/attendance/modify/${l.lessonId}|}">
                <option value="" th:selected="${st == '-'}">-</option>
                <option value="Y" th:selected="${st == 'Y'}">출석</option>
                <option value="L" th:selected="${st == 'L'}">지각</option>
                <option value="E" th:selected="${st == 'E'}">공결</option>
                <option value="N" th:selected="${st == 'N'}">결석</option>
              </select>
            </td>

            <td class="cnt" th:text="${r.present}">0</td>
            <td class="cnt" th:text="${r.late}">0</td>
            <td class="cnt" th:text="${r.excused}">0</td>
            <td class="cnt cnt-n" th:text="${r.absent}">0</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="actions">
      <a th:href="@{/attendance/list}" class="btn">목록</a>
      <a th:href="@{|/attendance/calendar/${course.courseId}|}" class="btn">달력으로 보기</a>
    </div>

    <!-- 상태 변경 전송용 폼 (칸이 많아서 폼 하나를 같이 씀) -->
    <form id="modify-form" method="post" style="display:none">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="userId" id="f-user">
      <input type="hidden" name="status" id="f-status">
    </form>

    <!-- 레이아웃 병합 때문에 content 안에 둠 -->
    <script>
      function changeAtt(sel) {
        var orig = sel.getAttribute('data-orig');
        if (!sel.value) { sel.value = orig; return; }          // '-' 로는 못 바꿈
        var label = sel.options[sel.selectedIndex].text;
        var msg = sel.getAttribute('data-name') + ' 학생의 [' + sel.getAttribute('data-lesson-title')
                + '] 출석을 "' + label + '"(으)로 변경할까요?';
        if (!confirm(msg)) { sel.value = orig; return; }       // 취소하면 원래대로
        var f = document.getElementById('modify-form');
        f.action = sel.getAttribute('data-action');
        document.getElementById('f-user').value = sel.getAttribute('data-user');
        document.getElementById('f-status').value = sel.value;
        f.submit();
      }
    </script>

  </div>
</body>

</html>
