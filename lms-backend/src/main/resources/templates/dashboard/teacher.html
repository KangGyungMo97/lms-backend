      layout:decorate="~{layout}">

<head>
  <title>교수 대시보드</title>
 </head>
 
<body>

    <p>TODO: 담당 강의 · 과제 채점 · 출석 관리 · Q&amp;A 답변</p>

    <!-- 로그아웃은 POST로 보내야 함 (th:action → CSRF 토큰 자동 포함) -->

      <button type="submit">로그아웃</button>
    </form>
  </div>
</body>

</html>
