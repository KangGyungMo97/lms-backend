<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>마이페이지</title>
  <style>
    .mp-wrap { display: flex; gap: 20px; align-items: flex-start; }
    .mp-col { flex: 1; min-width: 0; }
    .mp-card { background: #fff; border: 1px solid #e0e4ea; border-top: 2px solid #1f3a5f;
               padding: 20px; margin-bottom: 20px; }
    .mp-card h3 { margin: 0 0 14px; font-size: 16px; }
    table.mp-info { width: 100%; border-collapse: collapse; }
    table.mp-info th { width: 120px; text-align: left; padding: 9px 0; font-size: 14px; color: #555; font-weight: 600; }
    table.mp-info td { padding: 9px 0; font-size: 14px; }
    .mp-note { margin: 12px 0 0; font-size: 12px; color: #888; }
    .mp-field { margin-bottom: 14px; }
    .mp-field label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
    .mp-field input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc;
                      border-radius: 4px; font-size: 14px; }
    .mp-err { display: block; margin-top: 4px; color: #c0392b; font-size: 12px; }
    .mp-global { margin-bottom: 12px; padding: 9px 12px; background: #fdecea; color: #c0392b;
                 border-radius: 4px; font-size: 14px; }
    .mp-actions { text-align: right; }
    .btn { display: inline-block; padding: 8px 18px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #1f3a5f; color: #fff; font-size: 14px; cursor: pointer; }
  </style>
</head>

<body>
  <section layout:fragment="page-head">
    <div th:replace="~{fragments/page_head :: head('마이페이지', '내 정보', null)}"></div>
  </section>

  <div layout:fragment="content">
    <div class="mp-wrap">

      <!-- 왼쪽: 기본 정보 (조회 전용) -->
      <div class="mp-col">
        <div class="mp-card">
          <h3>기본 정보</h3>
          <table class="mp-info">
            <tr><th>학번 / 사번</th><td th:text="${me.userId}">2610001</td></tr>
            <tr><th>이름</th><td th:text="${me.userName}">김일학</td></tr>
            <tr><th>구분</th><td th:text="${roleLabel}">학생</td></tr>
            <tr><th>학과 / 학년</th>
                <td th:text="${me.dept.deptName} + (${me.userGrade != null} ? ' ' + ${me.userGrade} + '학년' : '')">스마트소프트웨어과 1학년</td></tr>
            <tr><th>생년월일</th><td th:text="${bdayText}">2007-03-15</td></tr>
            <tr><th>계정 발급일</th>
                <td th:text="${me.userCreated != null} ? ${#temporals.format(me.userCreated, 'yyyy-MM-dd')} : '-'">2026-10-13</td></tr>
            <tr><th>비밀번호 변경일</th>
                <td th:text="${me.userPwChanged != null} ? ${#temporals.format(me.userPwChanged, 'yyyy-MM-dd')} : '변경 이력 없음'">-</td></tr>
          </table>
          <p class="mp-note">※ 학번/사번, 이름, 구분, 생년월일, 학과·학년은 직접 수정할 수 없습니다.
            변경이 필요하면 1대1 문의로 요청해 주세요.</p>
        </div>
      </div>

      <!-- 오른쪽: 연락처 수정 + 비밀번호 변경 -->
      <div class="mp-col">

        <div class="mp-card">
          <h3>연락처 수정</h3>
          <form th:action="@{/mypage/profile}" th:object="${profileForm}" method="post">
            <div class="mp-field">
              <label for="userTel">휴대폰</label>
              <input type="text" id="userTel" th:field="*{userTel}" maxlength="13" placeholder="예) 010-1234-5678">
              <span class="mp-err" th:if="${#fields.hasErrors('userTel')}" th:errors="*{userTel}"></span>
            </div>
            <div class="mp-field">
              <label for="userEmail">이메일</label>
              <input type="text" id="userEmail" th:field="*{userEmail}" placeholder="예) user@test.com">
              <span class="mp-err" th:if="${#fields.hasErrors('userEmail')}" th:errors="*{userEmail}"></span>
            </div>
            <div class="mp-actions"><button type="submit" class="btn">저장</button></div>
          </form>
        </div>

        <div class="mp-card">
          <h3>비밀번호 변경</h3>
          <form th:action="@{/mypage/password}" th:object="${passwordForm}" method="post" autocomplete="off">
            <div class="mp-global" th:if="${#fields.hasGlobalErrors()}">
              <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
            </div>
            <div class="mp-field">
              <label for="currentPassword">현재 비밀번호</label>
              <input type="password" id="currentPassword" th:field="*{currentPassword}" autocomplete="current-password">
              <span class="mp-err" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
            </div>
            <div class="mp-field">
              <label for="newPassword">새 비밀번호</label>
              <input type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password"
                     placeholder="영문과 숫자를 포함해 8자 이상">
              <span class="mp-err" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
            </div>
            <div class="mp-field">
              <label for="newPasswordConfirm">새 비밀번호 확인</label>
              <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}" autocomplete="new-password">
              <span class="mp-err" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></span>
            </div>
            <div class="mp-actions"><button type="submit" class="btn">비밀번호 변경</button></div>
          </form>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
