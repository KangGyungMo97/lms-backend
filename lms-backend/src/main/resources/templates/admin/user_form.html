<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>계정 등록</title>
  <style>
    .form-box { background: #fff; border-top: 2px solid #1f3a5f; padding: 20px 24px; }
    .guide { color: #666; font-size: 13px; margin: 0 0 14px; }
    .row { display: flex; align-items: flex-start; margin-bottom: 14px; }
    .row > label { width: 130px; padding-top: 8px; font-weight: bold; font-size: 14px; }
    .row .req { color: #c0392b; font-size: 12px; }
    .row .field { flex: 1; }
    .row input[type=text], .row input[type=email], .row input[type=password], .row select {
      width: 100%; max-width: 360px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-family: inherit; font-size: 14px; }
    .row .hint { color: #999; font-size: 12px; margin-top: 4px; }
    .row .hint.ok { color: #2e7d32; }
    .row .hint.ng { color: #c0392b; }
    .row .fixed { padding-top: 8px; font-size: 14px; }
    .btn:disabled { border-color: #ccc; color: #aaa; background: #f5f5f5; cursor: not-allowed; }
    .row .radio { display: flex; gap: 18px; padding-top: 8px; }
    .row .radio label { font-weight: normal; }
    .field-error { color: #c0392b; font-size: 12px; margin-top: 4px; }
    .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
    .errors p { margin: 2px 0; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #1f3a5f; color: #fff; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>계정 등록</h2>
    <p class="guide">정보를 모두 입력한 뒤 <b>[임시 비밀번호 발급]</b>을 누르고 등록하세요. 임시 비밀번호는 관리자 화면에 표시되지 않고 <b>사용자 이메일로만</b> 발송됩니다.</p>

    <form th:action="@{/admin/user/create}" th:object="${userCreateForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="errors" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류</p>
      </div>

      <div class="form-box">

        <!-- 구분 -->
        <div class="row">
          <label>구분 <span class="req">*</span></label>
          <div class="field">
            <div class="radio">
              <label><input type="radio" th:field="*{userRole}" value="S" onchange="toggleGrade()"> 학생</label>
              <label><input type="radio" th:field="*{userRole}" value="P" onchange="toggleGrade()"> 교수</label>
              <label><input type="radio" th:field="*{userRole}" value="A" onchange="toggleGrade()"> 관리자</label>
            </div>
            <div class="field-error" th:if="${#fields.hasErrors('userRole')}" th:errors="*{userRole}"></div>
          </div>
        </div>

        <!-- 학번 / 사번 -->
        <div class="row">
          <label for="userId">학번 / 사번 <span class="req">*</span></label>
          <div class="field">
            <input type="text" id="userId" th:field="*{userId}" maxlength="20" placeholder="예: 2610001">
            <div class="hint">로그인 아이디로 사용됩니다. 학번 규칙: 연도 2 + 과정 1 + 순번 4 (과정 1 일반 / 3 하이테크 / 9 교수 / 0 관리자)</div>
            <div class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>
          </div>
        </div>

        <!-- 이름 -->
        <div class="row">
          <label for="userName">이름 <span class="req">*</span></label>
          <div class="field">
            <input type="text" id="userName" th:field="*{userName}" maxlength="20">
            <div class="field-error" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></div>
          </div>
        </div>

        <!-- 학과: 스마트소프트웨어과 하나로 고정 (고르지 않음) -->
        <div class="row">
          <label>학과</label>
          <div class="field">
            <div class="fixed" th:text="${deptName}">스마트소프트웨어과</div>
          </div>
        </div>

        <!-- 학년 (학생만, 필수) -->
        <div class="row" id="gradeRow">
          <label for="userGrade">학년 <span class="req">*</span></label>
          <div class="field">
            <select id="userGrade" th:field="*{userGrade}">
              <option value="">학년 선택</option>
              <option value="1">1학년</option>
              <option value="2">2학년</option>
              <option value="9">하이테크과정</option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('userGrade')}" th:errors="*{userGrade}"></div>
          </div>
        </div>

        <!-- 생년월일 -->
        <div class="row">
          <label for="userBday">생년월일 <span class="req">*</span></label>
          <div class="field">
            <input type="text" id="userBday" th:field="*{userBday}" maxlength="8" placeholder="예: 20070315">
            <div class="field-error" th:if="${#fields.hasErrors('userBday')}" th:errors="*{userBday}"></div>
          </div>
        </div>

        <!-- 이메일 -->
        <div class="row">
          <label for="userEmail">이메일 <span class="req">*</span></label>
          <div class="field">
            <input type="email" id="userEmail" th:field="*{userEmail}" maxlength="50" placeholder="예: student@test.com">
            <div class="field-error" th:if="${#fields.hasErrors('userEmail')}" th:errors="*{userEmail}"></div>
          </div>
        </div>

        <!-- 연락처 -->
        <div class="row">
          <label for="userTel">연락처 <span class="req">*</span></label>
          <div class="field">
            <input type="text" id="userTel" th:field="*{userTel}" maxlength="13" placeholder="예: 010-1234-5678">
            <div class="field-error" th:if="${#fields.hasErrors('userTel')}" th:errors="*{userTel}"></div>
          </div>
        </div>

        <!-- 임시 비밀번호 -->
        <div class="row">
          <label>임시 비밀번호 <span class="req">*</span></label>
          <div class="field">
            <input type="hidden" th:field="*{tempPwIssued}">
            <button type="button" class="btn" id="tempPwBtn" onclick="issueTempPw()" disabled>임시 비밀번호 발급</button>
            <div class="hint" id="tempPwMsg">위 정보를 모두 입력하면 버튼을 누를 수 있습니다.</div>
            <div class="field-error" th:if="${#fields.hasErrors('tempPwIssued')}" th:errors="*{tempPwIssued}"></div>
          </div>
        </div>

      </div>

      <div class="actions">
        <a th:href="@{/admin/user/list}" class="btn">목록</a>
        <button type="submit" class="btn btn-primary">계정 등록</button>
      </div>
    </form>

	<script>
	  // 학년은 학생일 때만 보이게
	  function toggleGrade() {
	    const studentRadio = document.querySelector('input[name="userRole"][value="S"]');
	    const student = studentRadio ? studentRadio.checked : false;
	    const gradeRow = document.getElementById('gradeRow');
	    if (gradeRow) {
	      gradeRow.style.display = student ? '' : 'none';
	    }
	    const userGrade = document.getElementById('userGrade');
	    if (!student && userGrade) {
	      userGrade.value = '';
	    }
	  }
	  toggleGrade();

	  // 📱 [추가] 전화번호 자동 하이픈 생성 함수
	  function autoHyphen(target) {
	    // 숫자만 남기고 나머지 문자 제거
	    let num = target.value.replace(/[^0-9]/g, '');
	    
	    // 글자 수에 따라 하이픈 배치 변경 (휴대폰 번호 및 일반 지역번호 대응)
	    if (num.length < 4) {
	      target.value = num;
	    } else if (num.length < 7) {
	      target.value = num.substr(0, 3) + '-' + num.substr(3);
	    } else if (num.length < 11) {
	      target.value = num.substr(0, 3) + '-' + num.substr(3, 3) + '-' + num.substr(6);
	    } else {
	      target.value = num.substr(0, 3) + '-' + num.substr(3, 4) + '-' + num.substr(7, 4);
	    }
	  }

	  // ===== 임시 비밀번호 발급 버튼 =====
	  const issued = document.getElementById('tempPwIssued');
	  const tempBtn = document.getElementById('tempPwBtn');
	  const tempMsg = document.getElementById('tempPwMsg');
	  const val = id => {
	    const el = document.getElementById(id);
	    return el ? el.value.trim() : '';
	  };

	  function formReady() {
	    const studentRadio = document.querySelector('input[name="userRole"][value="S"]');
	    const isStudent = studentRadio ? studentRadio.checked : false;
	    return val('userId') !== ''
	        && val('userName') !== ''
	        && (!isStudent || val('userGrade') !== '')
	        && /^\d{8}$/.test(val('userBday'))
	        && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('userEmail'))
	        && /^01\d-?\d{3,4}-?\d{4}$/.test(val('userTel'));
	  }

	  function refreshTempPw() {
	    if (!issued || !tempBtn || !tempMsg) return;

	    if (issued.value === 'true' && formReady()) {
	      tempBtn.textContent = '✔ 발급 예정';
	      tempBtn.disabled = true;
	      tempMsg.textContent = '계정 등록 시 임시 비밀번호가 생성되어 ' + val('userEmail') + '로 발송됩니다. (관리자 화면 미표시)';
	      tempMsg.className = 'hint ok';
	      return;
	    }
	    issued.value = 'false';
	    tempBtn.textContent = '임시 비밀번호 발급';
	    tempBtn.disabled = !formReady();
	    tempMsg.textContent = formReady() ? '버튼을 눌러 임시 비밀번호를 발급하세요.' : '위 정보를 모두 입력하면 버튼을 누를 수 있습니다.';
	    tempMsg.className = 'hint';
	  }

	  function issueTempPw() {
	    if (!formReady()) return;
	    if (issued) issued.value = 'true';
	    refreshTempPw();
	  }

	  // 이벤트 리스너 등록 및 초기화
	  ['userId', 'userName', 'userGrade', 'userBday', 'userEmail', 'userTel'].forEach(id => {
	    const el = document.getElementById(id);
	    if (el) {
	      el.addEventListener('input', refreshTempPw);
	      el.addEventListener('change', refreshTempPw);
	      
	      // 📱 [추가] 연락처 필드인 경우 실시간 하이픈 포맷팅 적용
	      if (id === 'userTel') {
	        el.addEventListener('input', (e) => {
	          autoHyphen(e.target);
	        });
	      }
	    }
	  });

	  document.querySelectorAll('input[name="userRole"]').forEach(r => {
	    r.addEventListener('change', () => {
	      toggleGrade();
	      refreshTempPw();
	    });
	  });

	  refreshTempPw();
	</script>
  </div>
</body>
</html>
