<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>Q&amp;A 상세</title>
  <style>
    .post { background: #fff; border-top: 2px solid #1f3a5f; border-bottom: 1px solid #e5e5e5; }
    .post-title { margin: 0; padding: 16px; font-size: 20px; border-bottom: 1px solid #e5e5e5; }
    .post-meta { padding: 10px 16px; color: #666; font-size: 13px; border-bottom: 1px solid #e5e5e5; }
    .post-meta span + span::before { content: "|"; margin: 0 8px; color: #ccc; }
    .post-content { padding: 24px 16px; min-height: 160px; line-height: 1.7; white-space: pre-wrap; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .b-wait { background: #fdecea; color: #c0392b; }
    .b-done { background: #e7f5ec; color: #1e7e46; }
    /* 답변 */
    .answers { margin-top: 24px; }
    .answers h4 { margin: 0 0 10px; }
    .answer { background: #f4f7fb; border-left: 3px solid #1f3a5f; padding: 12px 16px; margin-bottom: 10px; }
    .answer .meta { color: #666; font-size: 13px; margin-bottom: 6px; }
    .answer .body { white-space: pre-wrap; line-height: 1.6; }
    .no-answer { color: #888; font-size: 14px; }
    /* 답변 폼 (교수) */
    .answer-form { margin-top: 14px; }
    .answer-form textarea { width: 100%; height: 120px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
           font-family: inherit; font-size: 14px; resize: vertical; }
    .answer-form .btn-row { text-align: right; margin-top: 8px; }
    .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 10px 14px; margin-bottom: 10px; font-size: 14px; }
    .errors p { margin: 2px 0; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #1f3a5f; color: #fff; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>수업 Q&amp;A</h2>

    <!-- 질문 -->
    <div class="post">
      <h3 class="post-title">
        <span th:if="${qna.qnaStatus == 'C'}" class="badge b-done">답변완료</span>
        <span th:unless="${qna.qnaStatus == 'C'}" class="badge b-wait">답변대기</span>
        <span th:text="${qna.qnaTitle}">질문 제목</span>
      </h3>
      <div class="post-meta">
        <span>수업 <b th:text="${qna.lesson.lessonTitle}">6주차 조인</b></span>
        <span>작성자 <span th:text="${qna.writer.userName}">작성자</span></span>
        <span>작성일 <span th:text="${#temporals.format(qna.qnaCreateDate, 'yyyy-MM-dd HH:mm')}">2026-10-13 10:00</span></span>
      </div>
      <!-- white-space: pre-wrap 으로 줄바꿈 그대로 표시, th:text 라 HTML 태그는 글자로 나옴(안전) -->
      <div class="post-content" th:text="${qna.qnaContent}">질문 내용</div>
    </div>

    <!-- 답변 목록 -->
    <div class="answers">
      <h4>답변 <span th:text="${#lists.size(answerList)}">0</span>개</h4>

      <p class="no-answer" th:if="${answerList.isEmpty()}">아직 답변이 없습니다.</p>

      <div class="answer" th:each="answer : ${answerList}">
        <div class="meta">
          <b th:text="${answer.writer.userName}">교수</b> 교수 ·
          <span th:text="${#temporals.format(answer.answerCreateDate, 'yyyy-MM-dd HH:mm')}">2026-10-13 11:00</span>
        </div>
        <div class="body" th:text="${answer.answerContent}">답변 내용</div>
      </div>

      <!-- 답변 폼: 교수만 -->
      <form class="answer-form" th:if="${isTeacher}"
            th:action="@{|/qna/answer/create/${qna.qnaId}|}" th:object="${answerForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="errors" th:if="${#fields.hasAnyErrors()}">
          <p th:each="err : ${#fields.allErrors()}" th:text="${err}">오류 메시지</p>
        </div>

        <textarea th:field="*{content}" maxlength="300" placeholder="답변을 입력하세요."></textarea>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary">답변 등록</button>
        </div>
      </form>
    </div>

    <div class="actions">
      <a th:href="@{/qna/list}" class="btn">목록</a>
      <!-- 질문 수정 · 삭제 버튼은 P2 에서 추가 -->
    </div>

  </div>
</body>

</html>
