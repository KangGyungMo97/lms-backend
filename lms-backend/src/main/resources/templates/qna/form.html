<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>질문하기</title>
  <style>
    .form-box { background: #fff; border-top: 2px solid #1f3a5f; padding: 20px 16px; }
    .row { display: flex; margin-bottom: 14px; }
    .row label { width: 80px; padding-top: 8px; font-weight: bold; font-size: 14px; }
    .row label .req { color: #c0392b; font-size: 12px; }
    .row .field { flex: 1; }
    .row input, .row textarea, .row select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
           font-family: inherit; font-size: 14px; }
    .row textarea { height: 260px; resize: vertical; }
    .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
    .errors p { margin: 2px 0; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #1f3a5f; color: #fff; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>질문하기</h2>

    <!-- action 을 비워 두면 지금 주소(/qna/create)로 POST 됨 (자유게시판과 같은 방식) -->
    <form th:object="${qnaForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="errors" th:if="${#fields.hasAnyErrors()}">
        <p th:each="err : ${#fields.allErrors()}" th:text="${err}">오류 메시지</p>
      </div>

      <div class="form-box">
        <div class="row">
          <label for="lessonId">수업 <span class="req">*</span></label>
          <div class="field">
            <select id="lessonId" th:field="*{lessonId}">
              <option value="">-- 수업을 선택하세요 --</option>
              <option th:each="lesson : ${lessonList}" th:value="${lesson.lessonId}"
                      th:text="|${lesson.course.subject.subjectName} - ${lesson.lessonTitle}|">데이터베이스 - 6주차 조인</option>
            </select>
          </div>
        </div>
        <div class="row">
          <label for="title">제목 <span class="req">*</span></label>
          <div class="field">
            <input type="text" id="title" th:field="*{title}" maxlength="100" placeholder="제목을 입력하세요.">
          </div>
        </div>
        <div class="row">
          <label for="content">내용 <span class="req">*</span></label>
          <div class="field">
            <textarea id="content" th:field="*{content}" maxlength="1000" placeholder="궁금한 내용을 입력하세요."></textarea>
          </div>
        </div>
      </div>

      <div class="actions">
        <a th:href="@{/qna/list}" class="btn">취소</a>
        <button type="submit" class="btn btn-primary">등록</button>
      </div>
    </form>

  </div>
</body>

</html>
