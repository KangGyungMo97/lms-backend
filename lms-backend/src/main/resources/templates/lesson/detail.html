<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{layout}">

<head>
  <title>수업 상세 정보</title>
  <style>
    /* notice/detail.html과 100% 동일하게 통일한 상단 레이아웃 스타일 */
    .board-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
    .board-head h2 { margin: 0; font-size: 24px; color: #111; }
    
    /* 상세 페이지 전용 타이틀 및 메타 정보 영역 개편 */
    .detail-title { font-size: 20px; font-weight: 600; color: #1f3a5f; margin: 15px 0 10px 0; padding-bottom: 5px; }
    
    .meta-line { display: flex; gap: 15px; font-size: 13px; color: #666; padding: 10px 8px; background: #eef2f7; border-top: 2px solid #1f3a5f; border-bottom: 1px solid #e5e5e5; margin-bottom: 20px; }
    .meta-line span b { color: #333; margin-right: 4px; }

    /* 본문 텍스트 박스 공간 규격화 */
    .detail-content { background: #fff; min-height: 300px; padding: 20px 15px; font-size: 14px; line-height: 1.7; color: #333; border-bottom: 1px solid #e5e5e5; white-space: pre-wrap; word-break: break-all; }
    
    /* 하단 버튼 배치 인터페이스 존 */
    .btn-zone { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .btn-group-right { display: flex; gap: 6px; }
    
    /* 버튼 공통 표준 스타일 매핑 */
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: #f8f9fa; }
    .btn-primary { background: #1f3a5f; color: #fff; }
    .btn-primary:hover { background: #152943; }
    .btn-danger { border-color: #c0392b; color: #c0392b; background: #fff; }
    .btn-danger:hover { background: #c0392b; color: #fff; }
  </style>
</head>

<body>
  <main layout:fragment="content">

    <!-- 1. 대메뉴 타이틀 영역 -->
    <div class="board-head">
      <h2>수업 상세 정보</h2>
    </div>

    <!-- 2. 공지사항과 동일한 스타일의 제목 영역 -->
    <div class="detail-title" th:text="${lesson.lessonTitle}">
      1주차 - 오리엔테이션
    </div>
    
    <!-- 3. 메타 정보 영역 (과정명, 과목명, 교수, 시간 배치) -->
    <div class="meta-line">
      <span><b>과정</b> <span th:text="${lesson.course.courseTitle}">과정명</span></span>
      <span><b>과목</b> <span th:text="${lesson.course.subject.subjectName}">과목명</span></span>
      <span th:if="${lesson.course.teacher != null}"><b>담당 교수</b> <span th:text="${lesson.course.teacher.userName}">교수명</span></span>
      <span><b>시간</b> <span th:text="${lesson.course.courseTitle}">월 1~2교시</span></span>
    </div>

    <!-- 4. 수업 안내 본문 영역 -->
    <div class="detail-content" th:text="${lesson.lessonContent}">
      여기에 수업 세부 안내 내용이 출력됩니다.
    </div>

    <!-- 5. 하단 제어 버튼 컴포넌트 -->
    <div class="btn-zone">
      <!-- 왼쪽: 목록으로 가기 -->
      <a th:href="@{/lesson/list}" class="btn">목록</a>

      <!-- 오른쪽: 본인 담당 교수용 수정/삭제 제어 버튼 구역 -->
      <div class="btn-group-right" 
           sec:authorize="hasRole('TEACHER')" 
           th:if="${lesson.course.teacher != null and #authentication.name == lesson.course.teacher.userId}">
        
        <a th:href="@{|/lesson/update/${lesson.lessonId}|}" class="btn">수정</a>
        
        <form th:action="@{|/lesson/delete/${lesson.lessonId}|}" method="post" 
              onsubmit="return confirm('이 수업 정보를 정말 삭제하시겠습니까?');" style="display: inline;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-danger">삭제</button>
        </form>
      </div>
    </div>

  </main>
</body>
</html>
