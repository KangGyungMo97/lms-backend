<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>수업 상세</title>
  <style>
    .post { background: #fff; border-top: 2px solid #1f3a5f; border-bottom: 1px solid #e5e5e5; }
    .post-title { margin: 0; padding: 16px; font-size: 20px; border-bottom: 1px solid #e5e5e5; }
    .post-meta { padding: 10px 16px; color: #666; font-size: 13px; border-bottom: 1px solid #e5e5e5; }
    .post-meta span + span::before { content: "|"; margin: 0 8px; color: #ccc; }
    .post-content { padding: 24px 16px; min-height: 200px; line-height: 1.7; white-space: pre-wrap; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; }
  </style>
</head>

<body>
  <div layout:fragment="content"
       th:with="days=${ {'1':'월','2':'화','3':'수','4':'목','5':'금','6':'토','7':'일'} }">

    <h2>수업</h2>

    <div class="post">
      <h3 class="post-title" th:text="${lesson.lessonTitle}">수업명</h3>
      <div class="post-meta">
        <span>과정 <b th:text="${lesson.course.courseTitle}">과정명</b></span>
        <span>담당 교수 <b th:text="${lesson.course.teacher.userName}">교수</b></span>
        <!-- courseWeekday: 월 1 ~ 일 7 / 시작·종료는 교시 -->
        <span>시간 <span th:text="|${days[lesson.course.courseWeekday]} ${lesson.course.courseStartTime}~${lesson.course.courseEndTime}교시|">월 1~2교시</span></span>
      </div>
      <!-- white-space: pre-wrap 으로 줄바꿈 그대로 표시, th:text 라 HTML 태그는 글자로 나옴(안전) -->
      <div class="post-content" th:text="${lesson.lessonContent}">내용</div>
    </div>

    <div class="actions">
      <a th:href="@{/lesson/list}" class="btn">목록</a>
    </div>

  </div>
</body>

</html>
