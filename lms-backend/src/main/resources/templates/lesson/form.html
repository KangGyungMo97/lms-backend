<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title th:text="${isUpdate} ? '수업 수정' : '수업 등록'">수업 등록</title>
  <style>
    .form-box { background: #fff; border-top: 2px solid #1f3a5f; padding: 20px 16px; }
    .row { display: flex; margin-bottom: 14px; }
    .row label { width: 100px; padding-top: 8px; font-weight: bold; font-size: 14px; }
    .row label .req { color: #c0392b; font-size: 12px; }
    .row .field { flex: 1; }
    .row input, .row textarea, .row select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
           font-family: inherit; font-size: 14px; box-sizing: border-box; background: #fff; }
    .row textarea { height: 200px; resize: vertical; }
    .row .fixed { padding-top: 8px; font-size: 14px; }
    .row .hint { margin-top: 6px; color: #c0392b; font-size: 12px; }
    .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; font-family: inherit; cursor: pointer; }
    .btn-primary { background: #1f3a5f; color: #fff; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2 th:text="${isUpdate} ? '수업 수정' : '수업 등록'">수업 등록</h2>

    <!-- 등록: /lesson/create , 수정: /lesson/update/{id} (th:action 이 CSRF 토큰 자동 삽입) -->
    <form th:action="${isUpdate} ? @{|/lesson/update/${lessonId}|} : @{/lesson/create}" method="post">

      <div class="errors" th:if="${error}" th:text="${error}">오류 메시지</div>

      <div class="form-box">
        <div class="row">
          <label for="courseId">강좌 <span class="req">*</span></label>
          <div class="field">
            <!-- 수정: 강좌는 변경 불가, 텍스트로만 표시 -->
            <div class="fixed" th:if="${isUpdate}"
                 th:text="|[${course.subject.subjectId}] ${course.subject.subjectName} - ${course.courseTitle}|">강좌</div>

            <!-- 등록: 본인 강좌 선택 -->
            <th:block th:unless="${isUpdate}">
              <select id="courseId" name="courseId">
                <option value="">-- 강좌 선택 --</option>
                <option th:each="c : ${courses}" th:value="${c.courseId}"
                        th:selected="${c.courseId == selectedCourseId}"
                        th:text="|[${c.subject.subjectId}] ${c.subject.subjectName} - ${c.courseTitle}|"></option>
              </select>
              <div class="hint" th:if="${#lists.isEmpty(courses)}">담당 중인 강좌가 없습니다. 강좌를 먼저 개설하세요.</div>
            </th:block>
          </div>
        </div>
        <div class="row">
          <label for="lessonTitle">수업 제목 <span class="req">*</span></label>
          <div class="field">
            <input type="text" id="lessonTitle" name="lessonTitle" th:value="${lessonTitle}" maxlength="50"
                   placeholder="예) 1주차 - 오리엔테이션">
          </div>
        </div>
        <div class="row">
          <label for="lessonContent">수업 내용 <span class="req">*</span></label>
          <div class="field">
            <textarea id="lessonContent" name="lessonContent" maxlength="200" th:text="${lessonContent}"
                      placeholder="수업 내용을 입력하세요. (200자 이내)"></textarea>
          </div>
        </div>
      </div>

      <div class="actions">
        <a th:href="@{/lesson/list}" class="btn">취소</a>
        <button type="submit" class="btn btn-primary" th:text="${isUpdate} ? '수정' : '등록'">등록</button>
      </div>
    </form>

  </div>
</body>
</html>
