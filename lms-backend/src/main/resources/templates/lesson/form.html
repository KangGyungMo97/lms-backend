<!DOCTYPE html>
<html lang="ko" 
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://ultraq.net.nz" 
      layout:decorate="~{layout}">
<head>
    <title th:text="${isUpdate} ? '수업 수정' : '수업 등록'">수업 등록</title>
    <style>
        /* 과목 공지사항 폼과 완벽히 호환되도록 CSS 클래스 및 마크업 통일 완료 */
        .form-box { background: #fff; border-top: 2px solid #1f3a5f; padding: 20px 16px; margin-top: 12px; }
        .row { display: flex; margin-bottom: 14px; }
        .row label { width: 80px; padding-top: 8px; font-weight: bold; font-size: 14px; color: #333; }
        .row label .req { color: #c0392b; font-size: 12px; }
        .row .field { flex: 1; }
        
        .row input, .row select, .row textarea { 
            width: 100%; 
            padding: 8px 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-family: inherit; 
            font-size: 14px; 
            box-sizing: border-box; 
            color: #333;
        }
        .row input:focus, .row select:focus, .row textarea:focus { border-color: #1f3a5f; outline: none; }
        .row select { height: 38px; } 
        .row textarea { height: 300px; resize: vertical; }
        
        /* 컨트롤러 예외 오류 및 검증 피드백 알림 블록 */
        .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; border: 1px solid #f8b4b4; }
        .errors p { margin: 2px 0; }
        
        /* 하단 취소 / 완료 제어 액션 양끝 분할 정렬 */
        .actions { display: flex; justify-content: space-between; margin-top: 16px; }
        .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px; background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #f8f9fa; }
        .btn-primary { background: #1f3a5f; color: #fff; }
        .btn-primary:hover { background: #152943; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <!-- 등록/수정 모드 플래그(isUpdate)에 따른 상단 대제목 변경 -->
    <h2 th:text="${isUpdate} ? '수업 수정' : '수업 등록'">수업 등록</h2>
    
    <!-- LessonController 파라미터 맵 매핑 수용을 위한 무객체 전송 형식 구축 -->
    <form th:action="${isUpdate} ? @{|/lesson/update/${lessonId}|} : @{/lesson/create}" method="post">
        <!-- 스프링 시큐리티 인가 가드 토큰 탑재 -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        
        <!-- 백엔드 바인딩 예외 처리용 에러 브리핑 보드 -->
        <div class="errors" th:if="${error}">
            <p th:text="${error}">오류 메시지</p>
        </div>
        
        <div class="form-box">
            <!-- [1. 강좌 선택 로우] -->
            <div class="row">
                <label for="courseId">강좌 <span class="req">*</span></label>
                <div class="field">
                    <!-- [수정일 때] 기존 강좌명을 박아둔 채 readonly 처리 -->
                    <div th:if="${isUpdate}">
                        <select id="courseId" name="courseId" class="form-control" style="background-color: #f5f5f5;" readonly="readonly">
                            <option th:value="${course != null ? course.courseId : ''}" 
                                    th:text="${course != null ? course.courseTitle : ''}" selected="selected"></option>
                        </select>
                    </div>
                    
                    <!-- [등록일 때] 작성 교수 소유의 개설 강의 셀렉트 박스 구동 -->
                    <div th:unless="${isUpdate}">
                        <select id="courseId" name="courseId">
                            <option value="">-- 강좌를 선택하세요 --</option>
                            <option th:each="c : ${courses}" 
                                    th:value="${c.courseId}" 
                                    th:text="${c.courseTitle}"
                                    th:selected="${selectedCourseId != null and c.courseId == selectedCourseId}"></option>
                        </select>
                        <div th:if="${#lists.isEmpty(courses)}" style="color: #666; font-size: 13px; margin-top: 6px; font-weight: normal;">
                            ℹ️ 현재 담당 중인 활성화 강좌 목록이 존재하지 않습니다. 강좌를 먼저 개설하세요.
                        </div>
                    </div>
                </div>
            </div>

            <!-- [2. 수업 제목 입력란 로우] -->
            <div class="row">
                <label for="lessonTitle">제목 <span class="req">*</span></label>
                <div class="field">
                    <input type="text" id="lessonTitle" name="lessonTitle" th:value="${lessonTitle != null ? lessonTitle : ''}" placeholder="수업 제목을 입력하세요 (예: 1주차 - 오리엔테이션)">
                </div>
            </div>
            
            <!-- [3. 수업 내용 기술란 로우] -->
            <div class="row">
                <label for="lessonContent">내용 <span class="req">*</span></label>
                <div class="field">
                    <textarea id="lessonContent" name="lessonContent" th:text="${lessonContent != null ? lessonContent : ''}" placeholder="상세 수업 내용을 입력하세요."></textarea>
                </div>
            </div>
        </div>
        
        <!-- 하단 양끝 정렬 조작 버튼 구역 -->
        <div class="actions">
            <a th:href="@{/lesson/list}" class="btn">취소</a>
            <button type="submit" class="btn btn-primary" th:text="${isUpdate} ? '수정' : '등록'">등록</button>
        </div>
    </form>
</div>
</body>
</html>
