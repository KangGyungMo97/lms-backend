<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-4">
    
    <!-- 대제목 및 검색, 과목등록 영역 -->
    <div class="row my-3 align-items-center">
        <div class="col-md-6">
            <h3 class="border-bottom pb-2">과목 목록</h3>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-secondary">홈</a></li>
                    <li class="breadcrumb-item text-secondary">교육안내</li>
                    <li class="breadcrumb-item active" aria-current="page">과목 목록</li>
                </ol>
            </nav>
        </div>
        <!-- 검색 및 등록 버튼 우측 정렬 -->
        <div class="col-md-6 d-flex justify-content-end gap-2 align-items-end" style="height: 100%;">
            <div class="input-group w-50">
                <input type="text" id="search_kw" class="form-control" placeholder="과목코드/과목명/학과" th:value="${kw}">
                <button class="btn btn-outline-secondary" type="button" id="btn_search">검색</button>
            </div>
            <!-- 교수(TEACHER)나 관리자 권한이 있을 때만 과목 등록 버튼 노출 -->
            <a th:href="@{/subject/create}" class="btn btn-primary" sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">과목 등록</a>
        </div>
    </div>

    <!-- 플래시 메시지 처리 (삭제 실패 에러 메시지 알림용) -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 과목 테이블 테이블 레이아웃 수정 -->
    <table class="table table-hover text-center align-middle mt-4">
        <thead class="table-light">
            <tr>
                <th style="width: 10%;">번호</th>
                <th style="width: 20%;">과목코드</th>
                <th style="width: 35%;">과목명</th>
                <th style="width: 20%;">학과</th>
                <!-- 교수나 관리자일 때만 관리 헤더 노출 -->
                <th style="width: 15--" sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">관리</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="subject, loop : ${paging}">
                <!-- 번호 역순 계산 공식 -->
                <td th:text="${paging.getTotalElements - (paging.number * paging.size) - loop.index}"></td>
                <td th:text="${subject.subjectId}" class="font-monospace fw-bold text-secondary"></td>
                <td class="text-start">
                    <a th:href="@{|/subject/detail/${subject.subjectId}|}" th:text="${subject.subjectName}" class="text-decoration-none text-dark fw-semibold"></a>
                </td>
                <td><span class="badge bg-light text-dark border" th:text="${subject.dept.deptName}"></span></td>
                <!-- 관리 기능 (수정/삭제) -->
                <td sec:authorize="hasAnyRole('TEACHER', 'ADMIN')">
                    <div class="d-flex justify-content-center gap-1">
                        <a th:href="@{|/subject/update/${subject.subjectId}|}" class="btn btn-sm btn-outline-success">수정</a>
                        <!-- Controller 구조에 맞춰 POST 방식 요청을 위해 Form 이용 -->
                        <form th:action="@{|/subject/delete/${subject.subjectId}|}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${paging.isEmpty}">
                <td colspan="5" class="text-muted py-5">등록된 과목이 없습니다.</td>
            </tr>
        </tbody>
    </table>

    <!-- 페이징 처리 영역 -->
	<div th:if="${!paging.isEmpty}" style="display: flex; justify-content: center; margin: 30px 0; gap: 5px;">
	    <!-- 맨 처음 -->
	    <a href="javascript:void(0)" th:data-page="${0}" 
	       th:style="${!paging.hasPrevious} ? 'padding: 8px 12px; border: 1px solid #dee2e6; color: #6c757d; text-decoration: none; pointer-events: none; background-color: #f8f9fa;' : 'padding: 8px 12px; border: 1px solid #dee2e6; color: #0d6efd; text-decoration: none;'">«</a>
	    
	    <!-- 이전 -->
	    <a href="javascript:void(0)" th:data-page="${paging.number-1}" 
	       th:style="${!paging.hasPrevious} ? 'padding: 8px 12px; border: 1px solid #dee2e6; color: #6c757d; text-decoration: none; pointer-events: none; background-color: #f8f9fa;' : 'padding: 8px 12px; border: 1px solid #dee2e6; color: #0d6efd; text-decoration: none;'">‹</a>

	    <!-- 페이지 번호 -->
	    <th:block th:each="page: ${#numbers.sequence(0, paging.totalPages-1)}"
	              th:if="${page >= paging.number-5 and page <= paging.number+5}">
	        <a th:text="${page+1}" href="javascript:void(0)" th:data-page="${page}" 
	           th:style="${page == paging.number} ? 'padding: 8px 12px; border: 1px solid #0d6efd; background-color: #0d6efd; color: white; text-decoration: none; font-weight: bold;' : 'padding: 8px 12px; border: 1px solid #dee2e6; color: #0d6efd; text-decoration: none;'"></a>
	    </th:block>

	    <!-- 다음 -->
	    <a href="javascript:void(0)" th:data-page="${paging.number+1}" 
	       th:style="${!paging.hasNext} ? 'padding: 8px 12px; border: 1px solid #dee2e6; color: #6c757d; text-decoration: none; pointer-events: none; background-color: #f8f9fa;' : 'padding: 8px 12px; border: 1px solid #dee2e6; color: #0d6efd; text-decoration: none;'">›</a>
	    
	    <!-- 맨 끝 -->
	    <a href="javascript:void(0)" th:data-page="${paging.totalPages-1}" 
	       th:style="${!paging.hasNext} ? 'padding: 8px 12px; border: 1px solid #dee2e6; color: #6c757d; text-decoration: none; pointer-events: none; background-color: #f8f9fa;' : 'padding: 8px 12px; border: 1px solid #dee2e6; color: #0d6efd; text-decoration: none;'">»</a>
	</div>

    <!-- 페이징/검색용 히든 폼 -->
    <form th:action="@{/subject/list}" method="get" id="searchForm">
        <input type="hidden" id="page" name="page" th:value="${paging.number}">
        <input type="hidden" id="kw" name="kw" th:value="${kw}">
    </form>
</div>

<!-- 검색 및 페이징 작동 스크립트 -->
<script layout:fragment="script" type='text/javascript'>
const page_elements = document.getElementsByClassName("page-link");
Array.from(page_elements).forEach(function(element) {
    element.addEventListener('click', function() {
        document.getElementById('page').value = this.dataset.page;
        document.getElementById('searchForm').submit();
    });
});
const btn_search = document.getElementById("btn_search");
btn_search.addEventListener('click', function() {
    document.getElementById('kw').value = document.getElementById('search_kw').value;
    document.getElementById('page').value = 0;  // 검색버튼을 누를 때는 0페이지부터 조회
    document.getElementById('searchForm').submit();
});
</script>
</html>
