<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
  <title>과목 목록</title>
  <link rel="stylesheet" th:href="@{/css/lms.css}">
</head>
<body>
<main layout:fragment="content">
  <div class="page-head">
    <h1>과목 목록</h1>
    <div class="breadcrumb">홈 &gt; 교육안내 &gt; <b>과목 목록</b></div>
  </div>

  <!-- 검색 / 등록 -->
  <form class="toolbar" th:action="@{/subject/list}" method="get">
    <div class="toolbar-right">
      <input type="text" name="kw" th:value="${kw}" placeholder="과목코드 / 과목명 / 학과">
      <button type="submit" class="btn">검색</button>
      <a sec:authorize="hasRole('TEACHER')" class="btn btn-primary" th:href="@{/subject/create}">+ 과목 등록</a>
    </div>
  </form>

  <!-- 목록 -->
  <table class="list">
    <colgroup>
      <col style="width:80px"><col style="width:160px"><col><col style="width:220px">
    </colgroup>
    <thead>
      <tr><th>번호</th><th>과목코드</th><th>과목명</th><th>학과</th></tr>
    </thead>
    <tbody>
      <tr th:each="s, loop : ${paging}">
        <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}">1</td>
        <td th:text="${s.subjectId}">DB101</td>
        <td class="left">
          <a th:href="@{|/subject/detail/${s.subjectId}|}" th:text="${s.subjectName}">데이터베이스 설계와 SQL 실무</a>
        </td>
        <td th:text="${s.dept.deptName}">컴퓨터정보과</td>
      </tr>
      <tr th:if="${paging.isEmpty()}">
        <td colspan="4" class="empty">등록된 과목이 없습니다.</td>
      </tr>
    </tbody>
  </table>

  <!-- 페이징 -->
  <div class="pagination" th:if="${paging.totalPages > 0}">
    <a th:if="${paging.hasPrevious()}" th:href="@{/subject/list(page=0, kw=${kw})}">&laquo;</a>
    <span th:unless="${paging.hasPrevious()}" class="disabled">&laquo;</span>

    <a th:if="${paging.hasPrevious()}" th:href="@{/subject/list(page=${paging.number - 1}, kw=${kw})}">&lsaquo;</a>
    <span th:unless="${paging.hasPrevious()}" class="disabled">&lsaquo;</span>

    <th:block th:each="i : ${#numbers.sequence(0, paging.totalPages - 1)}">
      <th:block th:if="${i >= paging.number - 2 and i <= paging.number + 2}">
        <span th:if="${i == paging.number}" class="current" th:text="${i + 1}">1</span>
        <a th:unless="${i == paging.number}" th:href="@{/subject/list(page=${i}, kw=${kw})}" th:text="${i + 1}">2</a>
      </th:block>
    </th:block>

    <a th:if="${paging.hasNext()}" th:href="@{/subject/list(page=${paging.number + 1}, kw=${kw})}">&rsaquo;</a>
    <span th:unless="${paging.hasNext()}" class="disabled">&rsaquo;</span>

    <a th:if="${paging.hasNext()}" th:href="@{/subject/list(page=${paging.totalPages - 1}, kw=${kw})}">&raquo;</a>
    <span th:unless="${paging.hasNext()}" class="disabled">&raquo;</span>
  </div>
</main>
</body>
</html>
