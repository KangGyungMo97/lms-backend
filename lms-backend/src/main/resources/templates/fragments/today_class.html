<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  오늘의 수업 카드 (학생: 출석 코드 입력 / 교수: 수업 시작 · 코드 표시) 한 장 (대시보드 · 출석 화면에서 같이 씀)
    t       : TodayClass
    teacher : true 교수 / false 학생
    back    : 실패했을 때 돌아올 화면 ('dashboard' 또는 '')
  사용 예)
    <th:block th:each="t : ${todayList}">
      <div th:replace="~{fragments/today_class :: card(${t}, false, 'dashboard')}"></div>
    </th:block>
    (th:replace 가 th:each 보다 먼저 실행되므로 반복은 바깥 th:block 에)
-->
<div th:fragment="card(t, teacher, back)" class="today-card"
     th:classappend="${t.phase == 'ON' and t.started} ? 'live'">

  <div class="tc-main">
    <div class="tc-title">
      <!-- 상태 표시: 10:00 시작 / 진행 중 / 시작 전 / 종료 -->
      <span class="tc-badge soon" th:if="${t.phase == 'BEFORE'}" th:text="|${t.startLabel} 시작|">10:00 시작</span>
      <span class="tc-badge live" th:if="${t.phase == 'ON' and t.started}">진행 중</span>
      <span class="tc-badge wait" th:if="${t.phase == 'ON' and !t.started}">시작 전</span>
      <span class="tc-badge end"  th:if="${t.phase == 'END'}">종료</span>
      <b th:text="${t.course.courseTitle}">데이터베이스 설계와 SQL 실무</b>
    </div>
    <div class="tc-meta">
      <span th:text="|오늘 ${t.timeLabel}|">오늘 10:00~12:50</span>
      <span th:unless="${teacher}" th:text="|${t.course.teacher.userName} 교수|">박○○ 교수</span>
      <span th:if="${teacher}" th:text="|수강생 ${t.rosterCount}명|">수강생 28명</span>
      <span th:if="${t.lesson != null}" th:text="${t.lessonLabel}">4차시 SQL 기초</span>
      <span th:if="${t.lesson == null}" class="tc-warn">등록된 차시 없음</span>
    </div>
  </div>

  <div class="tc-action">

    <!-- ===== 학생 ===== -->
    <th:block th:unless="${teacher}">
      <!-- 이미 기록이 있음 → 상태 + 강의실 입장 -->
      <th:block th:if="${t.myAtt != null}">
        <span class="tc-state" th:classappend="${t.myAtt.attStatus}"
              th:text="${t.myAtt.attStatus == 'Y' ? '출석 ' + #temporals.format(t.myAtt.attDate, 'HH:mm')
                       : t.myAtt.attStatus == 'L' ? '지각 ' + #temporals.format(t.myAtt.attDate, 'HH:mm')
                       : t.myAtt.attStatus == 'E' ? '공결' : '결석'}">출석 10:03</span>
        <a class="tc-btn line" th:if="${t.phase == 'ON'}"
           th:href="@{|/lesson/detail/${t.attSession.lesson.lessonId}|}">강의실 입장</a>
      </th:block>

      <th:block th:if="${t.myAtt == null}">
        <!-- 수업 시간 + 교수가 시작함 → 교수님이 알려 준 6자리 코드 입력 -->
        <form method="post" class="tc-code" th:if="${t.phase == 'ON' and t.started and !t.locked}"
              th:action="@{|/attendance/check/${t.course.courseId}|}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="back" th:value="${back}">
          <input type="text" name="code" maxlength="6" inputmode="numeric" pattern="\d{6}" autocomplete="off"
                 placeholder="출석 코드 6자리" required aria-label="출석 코드">
          <button type="submit" class="tc-btn">출석</button>
          <span class="tc-hint" th:if="${t.failCount > 0}" th:text="|남은 기회 ${t.remaining}회|">남은 기회 4회</span>
        </form>
        <span class="tc-state N" th:if="${t.phase == 'ON' and t.started and t.locked}">입력 잠김 (5회 오류)</span>
        <span class="tc-hint" th:if="${t.phase == 'ON' and !t.started}">교수님이 수업을 시작하면 코드를 입력할 수 있어요</span>
        <button type="button" class="tc-btn" disabled th:if="${t.phase == 'ON' and !t.started}">출석 대기</button>
        <button type="button" class="tc-btn" disabled th:if="${t.phase == 'BEFORE'}"
                th:text="|${t.startLabel} 시작|">10:00 시작</button>
        <span class="tc-state N" th:if="${t.phase == 'END' and t.started}">결석</span>
      </th:block>
    </th:block>

    <!-- ===== 교수 ===== -->
    <th:block th:if="${teacher}">
      <!-- 진행 중이면 출석 코드를 바로 보여 줌 (학생에게 알려 줄 번호) -->
      <span class="tc-codechip" th:if="${t.started and t.phase == 'ON'}">코드 <b th:text="${t.attSession.code}">048213</b></span>
      <a class="tc-btn" th:if="${t.started}" th:classappend="${t.phase == 'END'} ? 'line'"
         th:href="@{|/attendance/session/${t.attSession.lesson.lessonId}|}"
         th:text="|출석 현황 ${t.attendCount}/${t.rosterCount}|">출석 현황 12/28</a>

      <th:block th:unless="${t.started}">
        <form method="post" th:if="${t.phase == 'ON' and t.lesson != null}"
              th:action="@{|/attendance/start/${t.course.courseId}|}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="back" th:value="${back}">
          <button type="submit" class="tc-btn">수업 시작</button>
        </form>
        <a class="tc-btn line" th:if="${t.phase != 'END' and t.lesson == null}" th:href="@{/lesson/create}">차시 등록</a>
        <button type="button" class="tc-btn" disabled th:if="${t.phase == 'BEFORE' and t.lesson != null}"
                th:text="|${t.startLabel} 시작|">10:00 시작</button>
        <span class="tc-hint" th:if="${t.phase == 'END'}">진행하지 않은 수업</span>
      </th:block>
    </th:block>

  </div>
</div>

</body>
</html>
