<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  페이지 제목 띠 (제목 + 경로)
  사용법 (각 화면의 content 밖, body 안에):
    <section layout:fragment="page-head">
      <div th:replace="~{fragments/page_head :: head('강의 등록', '수업참여', '나의 강의')}"></div>
    </section>
  - menu  : 상단 메뉴 이름 (예: '수업참여')
  - sub   : 하위 메뉴 이름, 없으면 null  (예: head('과제', '나의 학습', null))
  - title : 화면 제목 → 경로 맨 끝에도 나옴 (sub 와 같으면 한 번만 표시)
-->
<div class="page-head" th:fragment="head(title, menu, sub)">
  <div class="inner">
    <h1 th:text="${title}">화면 제목</h1>
    <ol class="breadcrumb">
      <li><a th:href="@{/}">홈</a></li>
      <li th:if="${menu != null}" th:text="${menu}">메뉴</li>
      <li th:if="${sub != null and sub != title}" th:text="${sub}">하위 메뉴</li>
      <li th:text="${title}">화면 제목</li>
    </ol>
  </div>
</div>

</body>
</html>
