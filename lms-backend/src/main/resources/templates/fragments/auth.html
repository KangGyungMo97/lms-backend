<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 로그인 · 아이디 찾기 · 비밀번호 찾기 화면이 같이 쓰는 조각
     사용 예) <div th:replace="~{fragments/auth :: top}"></div>
             <div th:replace="~{fragments/auth :: art}"></div> -->

    <!-- 왼쪽 위: 학교 마크 | 학과 이름 (학교 마크 파일: static/img/school-logo.png) -->
    <div class="top" th:fragment="top">
      <img class="school" th:src="@{/img/school-logo.png}" alt="한국폴리텍대학 대전캠퍼스">
      <span class="bar"></span>
      <span class="dept">스마트소프트웨어과</span>
    </div>

  <!-- ===== 오른쪽: 그림 (직접 그린 SVG - 책 · 노트북 · 학사모) ===== -->
  <div class="art-side" aria-hidden="true" th:fragment="art">
    <svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg">
      <!-- 바닥 그림자 -->
      <ellipse cx="260" cy="372" rx="200" ry="14" fill="#c5d0ea"/>

      <!-- 잎 (왼쪽) -->
      <path d="M118 366 C 92 320, 96 270, 128 236 C 140 280, 140 326, 130 366 Z" fill="#3f8f7a"/>
      <path d="M134 366 C 132 312, 150 276, 186 256 C 182 300, 168 338, 148 366 Z" fill="#5fb39a"/>
      <path d="M100 366 C 78 340, 70 306, 82 280 C 100 304, 110 336, 112 366 Z" fill="#2f6f5f"/>

      <!-- 책 더미 -->
      <rect x="170" y="330" width="210" height="36" rx="6" fill="#2f6fd6"/>
      <rect x="170" y="330" width="210" height="8" rx="4" fill="#5d8fe3"/>
      <rect x="186" y="296" width="184" height="34" rx="6" fill="#f2a33a"/>
      <rect x="186" y="296" width="184" height="8" rx="4" fill="#f6bd6c"/>
      <rect x="178" y="264" width="196" height="32" rx="6" fill="#1f3a5f"/>
      <rect x="178" y="264" width="196" height="8" rx="4" fill="#355a8a"/>
      <rect x="352" y="264" width="8" height="32" fill="#e8edf6"/>
      <rect x="352" y="296" width="8" height="34" fill="#fff4e3"/>
      <rect x="352" y="330" width="8" height="36" fill="#e8edf6"/>

      <!-- 노트북 -->
      <path d="M210 262 L 340 262 L 356 246 L 194 246 Z" fill="#9aa8bf"/>
      <rect x="214" y="150" width="122" height="96" rx="8" fill="#2b3442"/>
      <rect x="222" y="158" width="106" height="80" rx="4" fill="#ffffff"/>
      <!-- 화면 속 로고 (펼친 책) -->
      <rect x="257" y="176" width="36" height="36" rx="8" fill="#1f3a5f"/>
      <path d="M263 186 c 5 -2 9 -1 12 2 v 16 c -3 -3 -7 -4 -12 -2 Z M287 186 c -5 -2 -9 -1 -12 2 v 16 c 3 -3 7 -4 12 -2 Z"
            fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="244" y="220" width="62" height="6" rx="3" fill="#dfe6f6"/>

      <!-- 학사모 -->
      <g transform="translate(372 96) rotate(12)">
        <path d="M0 18 L 40 0 L 80 18 L 40 36 Z" fill="#1f3a5f"/>
        <path d="M18 27 V 44 C 18 52, 62 52, 62 44 V 27 L 40 37 Z" fill="#2c4f7f"/>
        <path d="M70 22 V 46" stroke="#f2a33a" stroke-width="3"/>
        <circle cx="70" cy="48" r="4" fill="#f2a33a"/>
      </g>

      <!-- 출석 체크 카드 -->
      <g transform="translate(92 120) rotate(-8)">
        <rect width="92" height="62" rx="10" fill="#ffffff"/>
        <circle cx="24" cy="31" r="12" fill="#e6f4ec"/>
        <path d="M18 31 l 5 5 l 9 -10" fill="none" stroke="#2e9b5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="44" y="22" width="36" height="6" rx="3" fill="#c9d3e6"/>
        <rect x="44" y="34" width="26" height="6" rx="3" fill="#e3e8f2"/>
      </g>

      <!-- 달력 카드 -->
      <g transform="translate(396 196) rotate(6)">
        <rect width="70" height="64" rx="10" fill="#ffffff"/>
        <rect width="70" height="18" rx="9" fill="#2f6fd6"/>
        <rect y="9" width="70" height="9" fill="#2f6fd6"/>
        <g fill="#c9d3e6">
          <rect x="10" y="28" width="10" height="9" rx="2"/><rect x="30" y="28" width="10" height="9" rx="2"/><rect x="50" y="28" width="10" height="9" rx="2"/>
          <rect x="10" y="44" width="10" height="9" rx="2"/><rect x="50" y="44" width="10" height="9" rx="2"/>
        </g>
        <rect x="30" y="44" width="10" height="9" rx="2" fill="#f2a33a"/>
      </g>

      <!-- 말풍선 (Q&A) -->
      <g transform="translate(250 58)">
        <rect width="64" height="40" rx="12" fill="#ffffff"/>
        <path d="M14 40 L 10 54 L 26 40 Z" fill="#ffffff"/>
        <text x="32" y="26" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="700" fill="#2f6fd6">Q&amp;A</text>
      </g>

      <!-- 반짝이 · 점 -->
      <g fill="#f2a33a">
        <path d="M200 92 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z"/>
        <circle cx="452" cy="300" r="5"/>
      </g>
      <g fill="#9fb3dc">
        <circle cx="70" cy="230" r="5"/><circle cx="470" cy="150" r="6"/><circle cx="340" cy="40" r="4"/>
      </g>
    </svg>
  </div>

</body>
</html>
