<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>채점</title>
  <style>
    .post { background: #fff; border-top: 2px solid #1f3a5f; border-bottom: 1px solid #e5e5e5; }
    .post-title { margin: 0; padding: 16px; font-size: 18px; border-bottom: 1px solid #e5e5e5; }
    .post-meta { padding: 10px 16px; color: #666; font-size: 13px; border-bottom: 1px solid #e5e5e5; }
    .post-meta span + span::before { content: "|"; margin: 0 8px; color: #ccc; }
    .post-content { padding: 24px 16px; min-height: 140px; line-height: 1.7; white-space: pre-wrap; }
    .grade-box { margin-top: 20px; background: #fff; border: 1px solid #e5e5e5; border-radius: 4px; padding: 16px; }
    .grade-box h4 { margin: 0 0 12px; }
    .row { display: flex; margin-bottom: 12px; }
    .row label { width: 80px; padding-top: 8px; font-weight: bold; font-size: 14px; }
    .row .field { flex: 1; }
    .row input, .row textarea { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 14px; }
    .row input { width: 120px; }
    .row textarea { width: 100%; height: 100px; resize: vertical; }
    .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
    .errors p { margin: 2px 0; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #1f3a5f; color: #fff; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>채점</h2>

    <!-- 제출물 -->
    <div class="post">
      <h3 class="post-title" th:text="${submit.homework.homeworkTitle}">과제 제목</h3>
      <div class="post-meta">
        <span>학번 <b th:text="${submit.student.userId}">2610001</b></span>
        <span>이름 <span th:text="${submit.student.userName}">김일학</span></span>
        <span>제출일 <span th:text="${#temporals.format(submit.submitDate, 'yyyy-MM-dd HH:mm')}">2026-10-05 14:20</span></span>
      </div>
      <div class="post-content" th:text="${submit.submitContent}">제출 내용</div>
    </div>

    <!-- 채점 폼 (이미 채점했으면 기존 값이 채워져 있음 → 다시 저장하면 수정) -->
    <form th:action="@{|/homework/submit/grade/${submit.submitId}|}" th:object="${gradeForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="grade-box">
        <h4 th:text="${submit.submitIsDone == 'R'} ? '채점 수정' : '채점하기'">채점하기</h4>

        <div class="errors" th:if="${#fields.hasAnyErrors()}">
          <p th:each="err : ${#fields.allErrors()}" th:text="${err}">오류 메시지</p>
        </div>

        <div class="row">
          <label for="score">점수</label>
          <div class="field">
            <input type="number" id="score" th:field="*{score}" min="0" max="100" placeholder="0 ~ 100"> 점
          </div>
        </div>
        <div class="row">
          <label for="feedback">피드백</label>
          <div class="field">
            <textarea id="feedback" th:field="*{feedback}" maxlength="200" placeholder="학생에게 남길 피드백 (선택)"></textarea>
          </div>
        </div>
      </div>

      <div class="actions">
        <a th:href="@{|/homework/submit/list/${submit.homework.homeworkId}|}" class="btn">제출 현황</a>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>

  </div>
</body>

</html>
