<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title th:text="${mode == 'modify'} ? '과제 수정' : '과제 등록'">과제 등록</title>
  <style>
    .form-box { background: #fff; border-top: 2px solid #1f3a5f; padding: 20px 16px; }
    .row { display: flex; margin-bottom: 14px; }
    .row label { width: 80px; padding-top: 8px; font-weight: bold; font-size: 14px; }
    .row label .req { color: #c0392b; font-size: 12px; }
    .row .field { flex: 1; }
    .row input, .row textarea, .row select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
           font-family: inherit; font-size: 14px; }
    .row textarea { height: 260px; resize: vertical; }
    .row .dates { display: flex; align-items: center; gap: 8px; }
    .row .dates input { width: 180px; }
    .hint { color: #888; font-size: 12px; margin: 4px 0 0; }
    .errors { background: #fdecea; color: #c0392b; border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
    .errors p { margin: 2px 0; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #1f3a5f; color: #fff; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2 th:text="${mode == 'modify'} ? '과제 수정' : '과제 등록'">과제 등록</h2>

    <!-- action 을 비워 두면 지금 주소로 POST 됨
         → /homework/create 에서 열면 등록, /homework/modify/{id} 에서 열면 수정 (화면 하나로 같이 씀) -->
    <form th:object="${homeworkForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="errors" th:if="${#fields.hasAnyErrors()}">
        <p th:each="err : ${#fields.allErrors()}" th:text="${err}">오류 메시지</p>
      </div>

      <div class="form-box">
        <div class="row">
          <label for="lessonId">수업 <span class="req">*</span></label>
          <div class="field">
            <!-- 내가 담당하는 수업 회차만 나옴 (컨트롤러의 lessonList) -->
            <select id="lessonId" th:field="*{lessonId}">
              <option value="">수업을 선택하세요</option>
              <option th:each="l : ${lessonList}" th:value="${l.lessonId}"
                      th:text="|${l.course.subject.subjectName} - ${l.lessonTitle}|">데이터베이스 - 6주차</option>
            </select>
            <p class="hint" th:if="${#lists.isEmpty(lessonList)}">담당하는 수업이 없습니다. 수업(회차)이 먼저 등록되어 있어야 합니다.</p>
          </div>
        </div>
        <div class="row">
          <label for="title">제목 <span class="req">*</span></label>
          <div class="field">
            <input type="text" id="title" th:field="*{title}" maxlength="100" placeholder="과제 제목을 입력하세요.">
          </div>
        </div>
        <div class="row">
          <label>기간 <span class="req">*</span></label>
          <div class="field">
            <div class="dates">
              <input type="date" id="startDate" th:field="*{startDate}">
              ~
              <input type="date" id="endDate" th:field="*{endDate}">
            </div>
          </div>
        </div>
        <div class="row">
          <label for="content">내용 <span class="req">*</span></label>
          <div class="field">
            <textarea id="content" th:field="*{content}" maxlength="1000" placeholder="과제 내용과 제출 방법을 입력하세요."></textarea>
          </div>
        </div>
        <!-- 첨부파일(P3)은 FileService 완성 후 여기에 추가 -->
      </div>

      <div class="actions">
        <a th:href="@{/homework/list}" class="btn">취소</a>
        <button type="submit" class="btn btn-primary" th:text="${mode == 'modify'} ? '수정' : '등록'">등록</button>
      </div>
    </form>

  </div>
</body>

</html>
