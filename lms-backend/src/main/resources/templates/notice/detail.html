<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>공지사항 상세</title>
  <style>
    .post { background: #fff; border-top: 2px solid #1f3a5f; border-bottom: 1px solid #e5e5e5; }
    .post-title { margin: 0; padding: 16px; font-size: 20px; border-bottom: 1px solid #e5e5e5; }
    .post-meta { padding: 10px 16px; color: #666; font-size: 13px; border-bottom: 1px solid #e5e5e5; }
    .post-meta span + span::before { content: "|"; margin: 0 8px; color: #ccc; }
    .post-content { padding: 24px 16px; min-height: 200px; line-height: 1.7; white-space: pre-wrap; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .actions .right { display: flex; gap: 6px; }
    .actions form { margin: 0; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn-danger { border-color: #c0392b; color: #c0392b; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>공지사항</h2>

    <div class="post">
      <h3 class="post-title" th:text="${notice.noticeTitle}">제목</h3>
      <div class="post-meta">
        <span>작성자 <b th:text="${notice.writer.userName}">작성자</b></span>
        <span>작성일 <span th:text="${#temporals.format(notice.noticeCreateDate, 'yyyy-MM-dd')}">2026-10-11</span></span>
        <span th:if="${notice.noticeUpdateDate != notice.noticeCreateDate}">수정일 <span th:text="${#temporals.format(notice.noticeUpdateDate, 'yyyy-MM-dd')}">2026-10-11</span></span>
        <span>조회 <span th:text="${notice.noticeViewCount}">0</span></span>
      </div>
      <!-- white-space: pre-wrap 으로 줄바꿈 그대로 표시, th:text 라 HTML 태그는 글자로 나옴(안전) -->
      <div class="post-content" th:text="${notice.noticeContent}">내용</div>
    </div>

    <!-- 첨부파일은 FileService 완성 후 여기에 추가 -->

    <div class="actions">
      <a th:href="@{/notice/list}" class="btn">목록</a>
      <!-- 수정 · 삭제는 본인이 쓴 글일 때만 보임 (컨트롤러 checkWriter 와 같은 기준) -->
      <div class="right" sec:authorize="hasAnyRole('TEACHER', 'ADMIN')"
           th:if="${#authentication.name == notice.writer.userId}">
        <a th:href="@{|/notice/update/${notice.noticeId}|}" class="btn">수정</a>
        <!-- 삭제는 POST 라 form + CSRF 필요 -->
        <form th:action="@{|/notice/delete/${notice.noticeId}|}" method="post"
              onsubmit="return confirm('정말 삭제하시겠습니까?');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-danger">삭제</button>
        </form>
      </div>
    </div>

  </div>
</body>

</html>
