<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>수업 상세</title>
  <style>
    .post { background: #fff; border-top: 2px solid #1f3a5f; border-bottom: 1px solid #e5e5e5; }
    .post-title { margin: 0; padding: 16px; font-size: 20px; border-bottom: 1px solid #e5e5e5; }
    .post-meta { padding: 10px 16px; color: #666; font-size: 13px; border-bottom: 1px solid #e5e5e5; }
    .post-meta span + span::before { content: "|"; margin: 0 8px; color: #ccc; }
    .post-content { padding: 24px 16px; min-height: 200px; line-height: 1.7; white-space: pre-wrap; }
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .actions .right { display: flex; gap: 6px; }
    .actions form { margin: 0; }
    .btn { display: inline-block; padding: 7px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #fff; color: #1f3a5f; text-decoration: none; font-size: 14px; font-family: inherit; cursor: pointer; }
    .btn-danger { border-color: #c0392b; color: #c0392b; }
  </style>
</head>

<body>
  <div layout:fragment="content">

    <h2>수업 상세</h2>

    <div class="post">
		<h3 class="post-title">
		  <span th:if="${notice.course != null}" th:text="|[${notice.course.courseTitle}] |" style="color:#1f3a5f;"></span><span th:text="${notice.noticeTitle}">제목</span>
		</h3>
      <div class="post-meta">
        <span>과목 <b th:text="${lesson.course.subject.subjectName}">과목명</b></span>
        <span>강좌 <b th:text="${lesson.course.courseTitle}">강좌명</b></span>
        <span>담당 교수 <b th:text="${lesson.course.teacher.userName}">교수명</b></span>
      </div>
      <div class="post-content" th:text="${lesson.lessonContent}">내용</div>
    </div>

    <div class="actions">
      <a th:href="@{/lesson/list}" class="btn">목록</a>
      <!-- 수정 · 삭제는 본인이 담당하는 강좌의 수업일 때만 보임 -->
      <div class="right" sec:authorize="hasRole('TEACHER')"
           th:if="${#authentication.name == lesson.course.teacher.userId}">
        <a th:href="@{|/lesson/update/${lesson.lessonId}|}" class="btn">수정</a>
        <form th:action="@{|/lesson/delete/${lesson.lessonId}|}" method="post"
              onsubmit="return confirm('정말 삭제하시겠습니까?');">
          <button type="submit" class="btn btn-danger">삭제</button>
        </form>
      </div>
    </div>

  </div>
</body>
</html>
