spring.application.name=lms-backend
server.port=8080

# DATABASE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:~/lms
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=lms
spring.datasource.password=1234

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# MAIL (계정 등록 시 임시 비밀번호 발송) - 홍승훈
# 메일 서버 주소 · 계정 · 비밀번호는 GitHub 에 올리지 않고, 실행할 때 환경변수로 넣기
#   SPRING_MAIL_HOST=smtp.gmail.com / SPRING_MAIL_USERNAME=보내는Gmail주소 / SPRING_MAIL_PASSWORD=Gmail 앱 비밀번호(16자리)
# 환경변수가 없으면 메일 대신 STS 콘솔에 [DEV MAIL] 로 출력됨 (개발 · 테스트용)
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# FILE UPLOAD (과제 · 제출 첨부파일)
# 파일 1개 20MB, 한 번에 올리는 전체 50MB까지
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
# 업로드 파일 저장 폴더 (기본: 내 사용자 폴더/lms-upload) - Git 에 올라가지 않는 곳
lms.upload-dir=${user.home}/lms-upload
